01</tspan></text><text x="540" y="492" text-anchor="middle" fill="#20334f" font-size="18" font-weight="400"><tspan x="540" dy="0">Yêu cầu Agent điều tra biến động</tspan><tspan x="540" dy="23.04">tài chính</tspan></text><ellipse cx="540" cy="626" rx="225" ry="53" stroke="#884cc0" stroke-width="2.2" fill="#faf4ff"/><text x="540" y="600" text-anchor="middle" fill="#884cc0" font-size="15" font-weight="700"><tspan x="540" dy="0">UC-AGENT-02</tspan></text><text x="540" y="629" text-anchor="middle" fill="#20334f" font-size="18" font-weight="400"><tspan x="540" dy="0">Yêu cầu Agent lập dự thảo</tspan><tspan x="540" dy="23.04">Plan–Goal liên kết</tspan></text><ellipse cx="1100" cy="230" rx="225" ry="53" stroke="#884cc0" stroke-width="2.2" fill="#faf4ff"/><text x="1100" y="204" text-anchor="middle" fill="#884cc0" font-size="15" font-weight="700"><tspan x="1100" dy="0">UC-DRAFT-APPLY-01</tspan></text><text x="1100" y="233" text-anchor="middle" fill="#20334f" font-size="18" font-weight="400"><tspan x="1100" dy="0">Xem trước và xác nhận áp dụng dự</tspan><tspan x="1100" dy="23.04">thảo</tspan></text><ellipse cx="1100" cy="420" rx="225" ry="53" stroke="#3566aa" stroke-width="2.2" fill="#f1f7ff"/><text x="1100" y="394" text-anchor="middle" fill="#3566aa" font-size="15" font-weight="700"><tspan x="1100" dy="0">UC-SIM-01</tspan></text><text x="1100" y="423" text-anchor="middle" fill="#20334f" font-size="18" font-weight="400"><tspan x="1100" dy="0">Chạy mô phỏng kịch bản (dùng</tspan><tspan x="1100" dy="23.04">chung phân hệ 5)</tspan></text><text x="265" y="789" font-size="14" fill="#52637b">Đường liền: liên kết tác nhân · Nét đứt: include/extend · Điều kiện và extension point: xem bảng quan hệ trong đặc tả</text></g></svg>