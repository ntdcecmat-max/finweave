<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="24" y="20" width="1552" height="70" rx="12" fill="#101d35"/><text x="48" y="52" font-size="23" font-weight="700" fill="white">KIẾN TRÚC BACKEND NGHIỆP VỤ — modular monolith, nhiều process</text><text x="48" y="77" font-size="15" fill="#bbcbe3">FinWeave · Architecture view · 28/10/2026 · đặc tả và đối chiếu, không chứng nhận nghiệm thu</text><rect x="40" y="135" width="420" height="120" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="250" y="167" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="250" dy="0">User web</tspan></text><text x="250" y="201" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="250" dy="0">React + TypeScript + Vite</tspan><tspan x="250" dy="21.76">Browser → user API</tspan></text><rect x="590" y="135" width="420" height="120" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="800" y="167" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="800" dy="0">Android APK</tspan></text><text x="800" y="201" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="800" dy="0">React UI + Capacitor + Kotlin</tspan><tspan x="800" dy="21.76">Consent · encrypted outbox · sync</tspan></text><rect x="1140" y="135" width="420" height="120" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="1350" y="167" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="1350" dy="0">Admin web</tspan></text><text x="1350" y="201" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="1350" dy="0">Build / origin / phiên riêng</tspan><tspan x="1350" dy="21.76">Chỉ operational metadata</tspan></text><rect x="130" y="365" width="520" height="140" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="390" y="397" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="390" dy="0">User / Device API process</tspan></text><text x="390" y="431" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="390" dy="0">Fastify + TypeScript · auth / scope</tspan><tspan x="390" dy="21.76">Finance · accounts · imports · planning</tspan><tspan x="390" dy="21.76">Preview → owner confirm → UnitOfWork</tspan></text><rect x="1030" y="365" width="480" height="140" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="1270" y="397" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="1270" dy="0">Ops API process</tspan></text><text x="1270" y="431" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="1270" dy="0">Admin identity + TOTP</tspan><tspan x="1270" dy="21.76">Pool metadata riêng · safe command broker</tspan><tspan x="1270" dy="21.76">Không có finance pool</tspan></text><path d="M250 255 L350 365" stroke="#48617e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="300" y="300" text-anchor="middle" fill="#20334f" font-size="15" font-weight="400"><tspan x="300" dy="0">HTTP contract</tspan></text><path d="M800 255 L610 365" stroke="#48617e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="705" y="300" text-anchor="middle" fill="#20334f" font-size="15" font-weight="400"><tspan x="705" dy="0">native credential / receipt</tspan></text><path d="M1350 255 L1270 365" stroke="#48617e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1310" y="300" text-anchor="middle" fill="#20334f" font-size="15" font-weight="400"><tspan x="1310" dy="0">admin session</tspan></text><rect x="130" y="605" width="520" height="140" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="390" y="637" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="390" dy="0">Module services + Financial Engine</tspan></text><text x="390" y="671" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="390" dy="0">Exact money / quantity · immutable ledger</tspan><tspan x="390" dy="21.76">Một codebase, public service boundaries</tspan><tspan x="390" dy="21.76">Mua tài sản / Plan–Goal bundle: atomic</tspan></text><rect x="900" y="605" width="610" height="140" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="1205" y="637" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="1205" dy="0">Worker processes theo capability</tspan></text><text x="1205" y="671" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="1205" dy="0">Ingestion · market · forecast · agent · retention</tspan><tspan x="1205" dy="21.76">J2 dispatch / lease / retry / fencing</tspan><tspan x="1205" dy="21.76">Provider / model adapters có quyền hẹp</tspan></text><path d="M390 505 L390 605" stroke="#48617e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1270 505 L1270 605" stroke="#48617e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1270" y="545" text-anchor="middle" fill="#20334f" font-size="15" font-weight="400"><tspan x="1270" dy="0">safe request</tspan></text><rect x="300" y="860" width="1000" height="145" rx="12" fill="#f4f8ff" stroke="#31589f" stroke-width="2"/><text x="800" y="892" text-anchor="middle" fill="#31589f" font-size="21" font-weight="700"><tspan x="800" dy="0">PostgreSQL — authority của backend nghiệp vụ</tspan></text><text x="800" y="926" text-anchor="middle" fill="#20334f" font-size="17" font-weight="400"><tspan x="800" dy="0">Persistent ledger / domain state / snapshots / identity / J2 jobs</tspan><tspan x="800" dy="21.76">Pool và role tách theo profile · cùng consistency boundary</tspan><tspan x="800" dy="21.76">ACK receipt khác posted · quote không thay quantity · Agent không ghi actual</tspan></text><path d="M390 745 L530 860" stroke="#48617e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="460" y="792.5" text-anchor="middle" fill="#20334f" font-size="15" font-weight="400"><tspan x="460" dy="0">UnitOfWork / cùng PG client</tspan></text><path d="M1200 745 L1080 860" stroke="#48617e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1140" y="792.5" text-anchor="middle" fill="#20334f" font-size="15" font-weight="400"><tspan x="1140" dy="0">claim / commit / publish</tspan></text><text x="40" y="1058" font-size="16" fill="#52637b">Sơ đồ logic và process từ code + ADR; không khẳng định mọi process hiện đang chạy hoặc hệ thống đã được nghiệm thu production.</text></g></svg>