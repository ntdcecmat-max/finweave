# Application errors/counters are emitted through allowlisted DTOs. Native PG errors
# can embed supplied values: suppress ordinary statements/parameters/error detail.
# Native PANIC/core dumps and OS/proxy sinks still require deployment-specific review.
log_statement = 'none'
log_min_messages = 'panic'
log_min_error_statement = 'panic'
log_error_verbosity = 'terse'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
