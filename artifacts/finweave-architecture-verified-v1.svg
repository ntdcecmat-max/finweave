<text x="55" y="1727" font-size="22" fill="#577087" font-weight="400" text-anchor="start">Phạm vi local; nguồn tài chính thật và production chưa kích hoạt. Các hộp biểu diễn trách nhiệm, không khẳng định phân lớp tuyệt đối.</text>
