name: Verify FinWeave

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          run_install: false
      - name: Install backend from lockfile
        working-directory: finweave-backend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install frontend from lockfile
        working-directory: finweave-web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check backend types and unit tests
        working-directory: finweave-backend
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:retention
      - name: Check frontend types, tests and both builds
        working-directory: finweave-web
        run: |
          pnpm exec tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run --maxWorkers=1 --pool=threads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:admin
      - name: Check market parsing and pipeline
        working-directory: sites/finweave-demo
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --store-dir .sites-runtime/pnpm-store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/market.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-market-pipeline.mjs
